[package]
name = "cosh-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# agent-client-protocol 2.0 requires 1.88; the workspace floor stays at 1.74.
rust-version = "1.88"
description = "ACP bridge between cosh-shell and Agent Client Protocol agents"

[[bin]]
name = "cosh-acp"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "2"
clap.workspace = true
futures.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
